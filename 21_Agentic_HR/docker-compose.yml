services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: simple-hr-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: simple-hr-ui
    ports:
      - "${UI_PORT:-8501}:8501"
    env_file:
      - ../.env
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
